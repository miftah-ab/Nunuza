<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#174C3C">
  <title>You're offline | Nunuza</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8f8f5;color:#202522;font:16px/1.6 Inter,system-ui,sans-serif}
    main{width:min(100%,420px);padding:36px 28px;text-align:center;background:#fff;border:1px solid #e4e8e3;border-radius:24px;box-shadow:0 18px 50px -30px #174c3c55}
    img{width:52px;height:52px;margin-bottom:18px}h1{margin:0 0 10px;font-size:25px;letter-spacing:-.03em}p{margin:0 0 24px;color:#68716c}
    button{border:0;border-radius:12px;background:#174c3c;color:#fff;padding:12px 20px;font:600 14px Inter,system-ui,sans-serif;cursor:pointer}
    button:focus-visible{outline:3px solid #174c3c;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <img src="/brand/logo-icon.svg" alt="" width="52" height="52">
    <h1>You're offline</h1>
    <p>Nunuza couldn't reach the internet. Check your connection and try again. Your account and content are never stored in this offline page.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
