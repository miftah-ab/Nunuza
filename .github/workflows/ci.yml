name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production build
        run: npm run build


  db-worker-safety:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Atomic publishing and usage reservations against real Postgres
        run: bash scripts/test-worker-safety.sh

  db-claim-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Atomic job claim against real Postgres (8 parallel workers)
        run: bash scripts/test-claim-concurrency.sh

  db-entitlement-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Entitlement migration and privilege-boundary test
        run: bash scripts/test-entitlement-migration.sh

  generate-mcp-oauth-migration:
    if: ${{ github.ref == 'refs/heads/feat/claude-oauth-connection' && github.event_name == 'push' && contains(github.event.head_commit.message, 'ci(mcp): wire CLI migration generation job') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/claude-oauth-connection
          persist-credentials: true
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Generate migration using Supabase CLI
        id: migration
        shell: bash
        run: |
          set -euo pipefail
          supabase migration new mcp_oauth_security
          migration_file="$(find supabase/migrations -maxdepth 1 -type f -name '*_mcp_oauth_security.sql' -print | sort | tail -n 1)"
          test -n "$migration_file"
          echo "file=$migration_file" >> "$GITHUB_OUTPUT"
      - name: Write OAuth token isolation and RLS protections
        env:
          MIGRATION_FILE: ${{ steps.migration.outputs.file }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$MIGRATION_FILE" <<'SQL'
          CREATE OR REPLACE FUNCTION public.custom_access_token_hook(event jsonb)
          RETURNS jsonb
          LANGUAGE plpgsql
          STABLE
          SET search_path = ''
          AS $function$
          DECLARE
            claims jsonb := event -> 'claims';
          BEGIN
            IF claims IS NULL OR jsonb_typeof(claims) <> 'object' THEN
              RETURN jsonb_build_object('error', jsonb_build_object('http_code', 500, 'message', 'Invalid access-token hook payload.'));
            END IF;
            IF claims ? 'client_id' THEN
              claims := jsonb_set(claims, '{aud}', to_jsonb('https://nunuza-xi.vercel.app/api/mcp'::text), true);
            END IF;
            RETURN jsonb_build_object('claims', claims);
          END;
          $function$;

          REVOKE ALL ON FUNCTION public.custom_access_token_hook(jsonb) FROM PUBLIC, anon, authenticated;
          GRANT USAGE ON SCHEMA public TO supabase_auth_admin;
          GRANT EXECUTE ON FUNCTION public.custom_access_token_hook(jsonb) TO supabase_auth_admin;

          DO $migration$
          DECLARE
            target_table record;
            policy_name constant text := 'deny_oauth_client_direct_data_api';
          BEGIN
            FOR target_table IN
              SELECT tablename FROM pg_tables
              WHERE schemaname = 'public' AND rowsecurity = true
              ORDER BY tablename
            LOOP
              EXECUTE format('DROP POLICY IF EXISTS %I ON %I.%I', policy_name, 'public', target_table.tablename);
              EXECUTE format(
                'CREATE POLICY %I ON %I.%I AS RESTRICTIVE FOR ALL TO authenticated USING ((auth.jwt() ->> ''client_id'') IS NULL) WITH CHECK ((auth.jwt() ->> ''client_id'') IS NULL)',
                policy_name, 'public', target_table.tablename
              );
            END LOOP;
          END;
          $migration$;

          CREATE OR REPLACE FUNCTION public.current_workspace_id()
          RETURNS uuid
          LANGUAGE sql
          STABLE
          SECURITY DEFINER
          SET search_path TO 'public'
          AS $function$
            SELECT CASE
              WHEN (auth.jwt() ->> 'client_id') IS NOT NULL THEN NULL::uuid
              ELSE (SELECT id FROM public.workspaces WHERE owner_user_id = auth.uid() LIMIT 1)
            END;
          $function$;

          REVOKE EXECUTE ON FUNCTION public.handle_new_user() FROM PUBLIC, anon, authenticated;
          SQL
      - name: Commit generated migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git diff --cached --quiet && { echo "No generated migration found"; exit 1; }
          git commit -m "feat(mcp): add OAuth token isolation migration"
          git push origin HEAD:feat/claude-oauth-connection
