name: CI

on:
  push:
    branches: [main, "ci/**", "fix/**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run type-check
        continue-on-error: true
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Unit tests
        run: npm test
