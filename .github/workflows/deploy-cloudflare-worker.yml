name: Deploy Cloudflare Worker

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "wrangler.jsonc"
      - "open-next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Nunuza Worker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext Cloudflare Worker
        run: npm run wrangler:build

      - name: Deploy production Worker
        run: npx wrangler deploy --var NEXT_PUBLIC_APP_ENV:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
