name: Deploy Nunuza to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: nunuza-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NUNUZA_WORKER_ENV_JSON: ${{ secrets.NUNUZA_WORKER_ENV_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Load and validate application environment
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const env = JSON.parse(process.env.NUNUZA_WORKER_ENV_JSON || "{}");
          const required = [
            "NEXT_PUBLIC_APP_URL","NEXT_PUBLIC_SUPABASE_URL","NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY",
            "LINKEDIN_REDIRECT_URI","SUPABASE_SERVICE_ROLE_KEY",
            "GROQ_API_KEY","OPENROUTER_API_KEY","LINKEDIN_CLIENT_ID","LINKEDIN_CLIENT_SECRET",
            "LINKEDIN_TOKEN_ENCRYPTION_KEY","TELEGRAM_BOT_TOKEN","TELEGRAM_WEBHOOK_SECRET",
            "POLAR_ACCESS_TOKEN","POLAR_WEBHOOK_SECRET","POLAR_PRODUCT_ID",
            "WEB_PUSH_VAPID_PUBLIC_KEY","WEB_PUSH_VAPID_PRIVATE_KEY","WEB_PUSH_VAPID_SUBJECT",
            "WEB_PUSH_SUBSCRIPTION_ENCRYPTION_KEY"
          ];
          const missing = required.filter(key => typeof env[key] !== "string" || !env[key].trim());
          if (missing.length) throw new Error("Missing keys in NUNUZA_WORKER_ENV_JSON: " + missing.join(", "));
          for (const key of ["LINKEDIN_TOKEN_ENCRYPTION_KEY","WEB_PUSH_SUBSCRIPTION_ENCRYPTION_KEY"]) {
            if (!/^[0-9a-fA-F]{64}$/.test(env[key])) throw new Error(key + " must be exactly 64 hexadecimal characters.");
          }
          for (const [key, value] of Object.entries(env)) {
            if (!/^[A-Z_][A-Z0-9_]*$/.test(key) || typeof value !== "string") throw new Error("Invalid environment entry: " + key);
            process.stdout.write("::add-mask::" + value.replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A") + "\n");
            const delimiter = "ENV_" + crypto.randomBytes(16).toString("hex");
            fs.appendFileSync(process.env.GITHUB_ENV, key + "<<" + delimiter + "\n" + value + "\n" + delimiter + "\n");
          }
          NODE
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build production Worker
        run: npm run wrangler:build
      - name: Provision Cloudflare queues
        shell: bash
        run: |
          set -euo pipefail
          queues="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues?per_page=100")"
          for queue in nunuza-agent-jobs-dlq nunuza-agent-jobs; do
            if node -e 'const d=JSON.parse(process.argv[1]); process.exit(d.result?.some(q=>q.queue_name===process.argv[2])?0:1)' "$queues" "$queue"; then
              echo "Queue already exists: $queue"
            else
              payload="$(node -e 'process.stdout.write(JSON.stringify({queue_name:process.argv[1]}))' "$queue")"
              curl --fail-with-body --silent --show-error -X POST \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$payload" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues" >/dev/null
              echo "Created queue: $queue"
              queues="$(curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues?per_page=100")"
            fi
          done
      - name: Generate deployment config and Worker secrets
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
          config.vars = {
            ...config.vars,
            NEXT_PUBLIC_APP_ENV: "production",
            NEXT_PUBLIC_APP_URL: process.env.NEXT_PUBLIC_APP_URL,
            NEXT_PUBLIC_SUPABASE_URL: process.env.NEXT_PUBLIC_SUPABASE_URL,
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,
            LINKEDIN_REDIRECT_URI: process.env.LINKEDIN_REDIRECT_URI,
            LINKEDIN_API_VERSION: "202610",
            WEB_PUSH_VAPID_SUBJECT: process.env.WEB_PUSH_VAPID_SUBJECT
          };
          fs.writeFileSync(".wrangler.deploy.json", JSON.stringify(config, null, 2));
          const names = [
            "SUPABASE_SERVICE_ROLE_KEY","GROQ_API_KEY","OPENROUTER_API_KEY",
            "LINKEDIN_CLIENT_ID","LINKEDIN_CLIENT_SECRET","LINKEDIN_TOKEN_ENCRYPTION_KEY",
            "TELEGRAM_BOT_TOKEN","TELEGRAM_WEBHOOK_SECRET","POLAR_ACCESS_TOKEN",
            "POLAR_WEBHOOK_SECRET","POLAR_PRODUCT_ID",
            "WEB_PUSH_VAPID_PUBLIC_KEY","WEB_PUSH_VAPID_PRIVATE_KEY",
            "WEB_PUSH_SUBSCRIPTION_ENCRYPTION_KEY"
          ];
          const secrets = Object.fromEntries(names.filter(name => process.env[name] !== undefined).map(name => [name, process.env[name]]));
          fs.writeFileSync(".worker-secrets.json", JSON.stringify(secrets), { mode: 0o600 });
          NODE
      - name: Deploy Worker with runtime secrets
        run: npx wrangler deploy --config .wrangler.deploy.json --secrets-file .worker-secrets.json
      - name: Remove temporary secret files
        if: always()
        run: rm -f .worker-secrets.json .wrangler.deploy.json
