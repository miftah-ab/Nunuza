<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none" role="img" aria-label="Nunuza">
  <!-- Icon mark: geometric N in forest green -->
  <g transform="translate(0, 4)">
    <!-- Left vertical bar -->
    <rect x="0" y="0" width="7" height="32" fill="#174C3C"/>
    <!-- Right vertical bar -->
    <rect x="21" y="0" width="7" height="32" fill="#174C3C"/>
    <!-- Diagonal stroke (top-left to bottom-right) -->
    <polygon points="7,0 14,0 28,32 21,32" fill="#174C3C"/>
  </g>
  <!-- Wordmark: Nunuza -->
  <text
    x="42"
    y="28"
    font-family="Inter, system-ui, sans-serif"
    font-size="22"
    font-weight="700"
    fill="#202522"
    letter-spacing="-0.3"
  >Nunuza</text>
</svg>
