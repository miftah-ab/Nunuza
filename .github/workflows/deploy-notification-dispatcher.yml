name: Deploy notification dispatcher

on:
  push:
    branches: [main]
    paths:
      - "workers/notification-dispatcher.ts"
      - "wrangler.notifications.jsonc"
      - ".github/workflows/deploy-notification-dispatcher.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nunuza-notification-dispatcher
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NUNUZA_CRON_SECRET: ${{ secrets.NUNUZA_CRON_SECRET }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub Actions secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$NUNUZA_CRON_SECRET" || { echo "Missing GitHub Actions secret: NUNUZA_CRON_SECRET"; exit 1; }
          test "${#NUNUZA_CRON_SECRET}" -ge 32 || { echo "NUNUZA_CRON_SECRET must be at least 32 characters"; exit 1; }

      - name: Deploy Cloudflare Worker and configure its secret
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.notifications.jsonc
          secrets: |
            CRON_SECRET=${{ secrets.NUNUZA_CRON_SECRET }}
