name: Deploy Nunuza to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nunuza-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_APP_URL: ${{ vars.NUNUZA_APP_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      LINKEDIN_REDIRECT_URI: ${{ vars.LINKEDIN_REDIRECT_URI }}
      LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
      LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
      LINKEDIN_TOKEN_ENCRYPTION_KEY: ${{ secrets.LINKEDIN_TOKEN_ENCRYPTION_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
      POLAR_WEBHOOK_SECRET: ${{ secrets.POLAR_WEBHOOK_SECRET }}
      POLAR_PRODUCT_ID: ${{ secrets.POLAR_PRODUCT_ID }}
      POLAR_PRICE_ID: ${{ secrets.POLAR_PRICE_ID }}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.WEB_PUSH_VAPID_PUBLIC_KEY }}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
      WEB_PUSH_VAPID_SUBJECT: ${{ vars.WEB_PUSH_VAPID_SUBJECT }}
      WEB_PUSH_SUBSCRIPTION_ENCRYPTION_KEY: ${{ secrets.WEB_PUSH_SUBSCRIPTION_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEXT_PUBLIC_APP_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY LINKEDIN_REDIRECT_URI LINKEDIN_API_VERSION SUPABASE_SERVICE_ROLE_KEY GROQ_API_KEY OPENROUTER_API_KEY LINKEDIN_CLIENT_ID LINKEDIN_CLIENT_SECRET LINKEDIN_TOKEN_ENCRYPTION_KEY TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET POLAR_ACCESS_TOKEN POLAR_WEBHOOK_SECRET POLAR_PRODUCT_ID POLAR_PRICE_ID WEB_PUSH_VAPID_PUBLIC_KEY WEB_PUSH_VAPID_PRIVATE_KEY WEB_PUSH_VAPID_SUBJECT WEB_PUSH_SUBSCRIPTION_ENCRYPTION_KEY)
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing GitHub Actions secrets/variables:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi
          for name in LINKEDIN_TOKEN_ENCRYPTION_KEY WEB_PUSH_SUBSCRIPTION_ENCRYPTION_KEY; do
            value="${!name}"
            if [[ ! "$value" =~ ^[0-9a-fA-F]{64}$ ]]; then
              echo "$name must be exactly 64 hexadecimal characters (32 bytes)."
              exit 1
            fi
          done
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build production Worker
        run: npm run wrangler:build
      - name: Provision Cloudflare queues
        shell: bash
        run: |
          set -euo pipefail
          queues="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues?per_page=100")"
          for queue in nunuza-agent-jobs-dlq nunuza-agent-jobs; do
            if node -e 'const d=JSON.parse(process.argv[1]); process.exit(d.result?.some(q=>q.queue_name===process.argv[2])?0:1)' "$queues" "$queue"; then
              echo "Queue already exists: $queue"
            else
              payload="$(node -e 'process.stdout.write(JSON.stringify({queue_name:process.argv[1]}))' "$queue")"
              response="$(curl --fail-with-body --silent --show-error -X POST \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$payload" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues")"
              echo "Created queue: $queue"
              queues="$(curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues?per_page=100")"
            fi
          done
      - name: Generate deployment config and Worker secrets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
          config.vars = {
            ...config.vars,
            NEXT_PUBLIC_APP_ENV: process.env.NEXT_PUBLIC_APP_ENV,
            NEXT_PUBLIC_APP_URL: process.env.NEXT_PUBLIC_APP_URL,
            NEXT_PUBLIC_SUPABASE_URL: process.env.NEXT_PUBLIC_SUPABASE_URL,
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,
            LINKEDIN_REDIRECT_URI: process.env.LINKEDIN_REDIRECT_URI,
            LINKEDIN_API_VERSION: process.env.LINKEDIN_API_VERSION,
            WEB_PUSH_VAPID_SUBJECT: process.env.WEB_PUSH_VAPID_SUBJECT
          };
          fs.writeFileSync(".wrangler.deploy.json", JSON.stringify(config, null, 2));
          const names = [
            "SUPABASE_SERVICE_ROLE_KEY","GROQ_API_KEY","OPENROUTER_API_KEY",
            "LINKEDIN_CLIENT_ID","LINKEDIN_CLIENT_SECRET","LINKEDIN_TOKEN_ENCRYPTION_KEY",
            "TELEGRAM_BOT_TOKEN","TELEGRAM_WEBHOOK_SECRET","POLAR_ACCESS_TOKEN",
            "POLAR_WEBHOOK_SECRET","POLAR_PRODUCT_ID","POLAR_PRICE_ID",
            "WEB_PUSH_VAPID_PUBLIC_KEY","WEB_PUSH_VAPID_PRIVATE_KEY",
            "WEB_PUSH_SUBSCRIPTION_ENCRYPTION_KEY"
          ];
          const secrets = Object.fromEntries(names.map(name => [name, process.env[name]]));
          fs.writeFileSync(".worker-secrets.json", JSON.stringify(secrets), { mode: 0o600 });
          NODE
      - name: Upload Worker secrets
        run: npx wrangler secret bulk .worker-secrets.json --config .wrangler.deploy.json
      - name: Deploy Worker
        run: npx wrangler deploy --config .wrangler.deploy.json
      - name: Remove temporary secret files
        if: always()
        run: rm -f .worker-secrets.json .wrangler.deploy.json
